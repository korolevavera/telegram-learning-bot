<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CS2 Coach</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0e14;
      --panel: #151a24;
      --panel2: #1d2432;
      --border: #2a3242;
      --text: #e6ecf5;
      --muted: #8b96a8;
      --accent: #ffb000;
      --green: #5cb85c;
      --red: #d9534f;
      --blue: #4a90d9;
    }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 74px;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: linear-gradient(135deg, #171d29, #0b0e14);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 {
      font-size: 18px; letter-spacing: 1px;
      display: flex; align-items: center; gap: 8px;
    }
    header h1 .logo { font-size: 20px; }
    #userName { color: var(--accent); font-size: 13px; }
    main { padding: 14px; }
    .hidden { display: none !important; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .card:active { background: var(--panel2); }
    .card h3 { font-size: 15px; margin-bottom: 4px; }
    .card p { color: var(--muted); font-size: 13px; }

    .btn {
      display: block; width: 100%;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      margin-top: 8px;
      cursor: pointer;
      text-align: center;
    }
    .btn.accent { background: var(--accent); color: #151500; border: none; font-weight: 700; }
    .btn.green { background: var(--green); color: #fff; border: none; }
    .btn.red { background: var(--red); color: #fff; border: none; }
    .btn.ghost { background: transparent; }

    .section-text {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-line;
    }
    .lesson-title { color: var(--accent); font-size: 16px; margin-bottom: 12px; }

    .progress-done { color: var(--green); font-size: 12px; }

    .question { font-size: 16px; font-weight: 600; margin-bottom: 14px; line-height: 1.5; }
    .option {
      display: block; width: 100%;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      margin-bottom: 8px;
      color: var(--text);
      cursor: pointer; text-align: left;
    }
    .option.correct { background: var(--green); border-color: var(--green); color: #fff; }
    .option.wrong { background: var(--red); border-color: var(--red); color: #fff; }
    .feedback { font-size: 14px; margin-bottom: 10px; font-weight: 600; }

    #answerInput {
      width: 100%; padding: 13px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      margin-bottom: 10px;
    }

    .flip-card {
      background: linear-gradient(145deg, var(--panel2), var(--panel));
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 40px 20px;
      text-align: center;
      min-height: 180px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .flip-card .front { font-size: 28px; font-weight: 800; }
    .flip-card .back { font-size: 18px; color: var(--accent); margin-top: 16px; }

    .counter { color: var(--muted); font-size: 13px; text-align: center; margin-top: 10px; }

    .bar { height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; margin-top: 6px; }
    .bar > div { height: 100%; background: var(--accent); border-radius: 5px; }
    .stat-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }

    nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 20;
    }
    nav button {
      flex: 1;
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 12px 4px;
      font-size: 12px;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    nav button .ico { font-size: 19px; }
    nav button.active { color: var(--accent); }

    .toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: var(--panel2); border: 1px solid var(--border);
      padding: 10px 18px; border-radius: 10px; font-size: 14px;
      z-index: 50; display: none;
    }
    .badge {
      background: var(--accent); color: #151500;
      border-radius: 6px; padding: 1px 7px; font-size: 11px; font-weight: 700;
    }
    #score { color: var(--accent); font-weight: 700; }

    .section-title { color: var(--accent); font-size: 14px; font-weight: 700; margin: 14px 0 8px; }
    .player-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .player-rank {
      min-width: 34px; text-align: center;
      font-weight: 800; font-size: 15px;
      color: var(--muted);
    }
    .player-rank.top1 { color: var(--accent); }
    .player-rank.top2, .player-rank.top3 { color: #c9d1dc; }
    .player-info { flex: 1; min-width: 0; }
    .player-nick { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-stat { text-align: right; min-width: 64px; }
    .player-stat .val { font-size: 14px; font-weight: 700; color: var(--accent); }
    .player-stat .lab { font-size: 10px; color: var(--muted); text-transform: uppercase; }
    .muted-note { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    .spinner { text-align: center; color: var(--muted); padding: 30px 0; }
  </style>
</head>
<body>
  <header>
    <h1><span class="logo">🎯</span> CS2 Coach</h1>
    <span id="userName"></span>
  </header>

  <div id="toast" class="toast"></div>

  <main id="view"></main>

  <nav id="tabs">
    <button data-tab="lessons" class="active"><span class="ico">📚</span>Уроки</button>
    <button data-tab="cards"><span class="ico">🃏</span>Карточки</button>
    <button data-tab="quizzes"><span class="ico">🧪</span>Тесты</button>
    <button data-tab="progress"><span class="ico">📊</span>Прогресс</button>
    <button data-tab="stats"><span class="ico">🏆</span>Статистика</button>
  </nav>

  <script>
  (function () {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#0b0e14'); }

    const view = document.getElementById('view');
    const userName = document.getElementById('userName');
    const toast = document.getElementById('toast');

    let state = { lessons: [], cards: [], quizzes: [], user: null };
    let lessonPos = null;   // { lesson, section }
    let cardIdx = 0;
    let cardState = {};     // per-session known set
    let quizState = null;   // { quiz, index, score, answered }

    const api = {
      headers: { 'x-init-data': tg ? tg.initData : '' },
      get(path) { return fetch(path, { headers: this.headers }).then(r => r.json()); },
      post(path, body) {
        return fetch(path, {
          method: 'POST',
          headers: { ...this.headers, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(r => r.json());
      }
    };

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function clear() { view.innerHTML = ''; }

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    function renderLessons() {
      clear();
      const title = el('h2', 'lesson-title', '📚 Уроки');
      view.appendChild(title);
      state.lessons.forEach((lesson, i) => {
        const card = el('div', 'card');
        const h = el('h3', null, lesson.title);
        const p = el('p', null, 'Разделов: ' + lesson.sections.length + ' · Вопросов: ' + lesson.questions.length);
        card.appendChild(h); card.appendChild(p);
        card.addEventListener('click', () => startLesson(lesson));
        view.appendChild(card);
      });
    }

    function startLesson(lesson) {
      lessonPos = { lesson: lesson, section: 0 };
      renderLessonSection();
    }

    function renderLessonSection() {
      clear();
      const lp = lessonPos;
      const lesson = lp.lesson;
      const title = el('div', 'lesson-title', lesson.title);
      const text = el('div', 'section-text', lesson.sections[lp.section]);
      view.appendChild(title);
      view.appendChild(text);
      const next = el('button', 'btn accent', lp.section + 1 < lesson.sections.length ? 'Дальше →' : 'К вопросам →');
      next.addEventListener('click', () => {
        if (lp.section + 1 < lesson.sections.length) {
          lp.section++;
          renderLessonSection();
        } else {
          lp.section = -1; lp.qIndex = 0;
          renderLessonQuestion();
        }
      });
      view.appendChild(next);
      const back = el('button', 'btn ghost', '← К урокам');
      back.addEventListener('click', () => { lessonPos = null; renderLessons(); });
      view.appendChild(back);
    }

    function renderLessonQuestion() {
      clear();
      const lp = lessonPos;
      const lesson = lp.lesson;
      if (lp.qIndex >= lesson.questions.length) {
        api.post('/api/lesson', { lesson_id: lesson.id }).then(() => {
          const done = el('div', 'section-text', '🎉 Урок пройден!');
          const back = el('button', 'btn accent', 'К урокам');
          back.addEventListener('click', () => { lessonPos = null; renderLessons(); });
          view.appendChild(done); view.appendChild(back);
        });
        return;
      }
      const q = lesson.questions[lp.qIndex];
      const qText = el('div', 'question', '❓ Вопрос ' + (lp.qIndex + 1) + '/' + lesson.questions.length + '\n' + q.q);
      const input = document.createElement('input');
      input.id = 'answerInput'; input.placeholder = 'Твой ответ...';
      view.appendChild(qText); view.appendChild(input);
      const send = el('button', 'btn accent', 'Ответить');
      send.addEventListener('click', () => {
        const reply = (input.value || '').trim().toLowerCase();
        const correct = reply && (reply === q.a.toLowerCase() || q.a.toLowerCase().includes(reply) || reply.includes(q.a.toLowerCase()));
        input.value = '';
        if (correct) showToast('✅ Верно!');
        else showToast('❌ ' + q.a);
        lp.qIndex++;
        renderLessonQuestion();
      });
      view.appendChild(send);
    }

    async function renderCards() {
      clear();
      if (!state.cards.length) return;
      if (cardIdx >= state.cards.length) {
        const done = el('div', 'section-text', '🎉 Все карточки пройдены!');
        const again = el('button', 'btn accent', 'Пройти заново');
        again.addEventListener('click', () => { cardIdx = 0; cardState = {}; renderCards(); });
        view.appendChild(done); view.appendChild(again);
        return;
      }
      const card = state.cards[cardIdx];
      const box = el('div', 'flip-card');
      const front = el('div', 'front', card.front);
      box.appendChild(front);
      if (cardState[cardIdx]) {
        const back = el('div', 'back', card.back);
        box.appendChild(back);
      }
      view.appendChild(box);

      const counter = el('div', 'counter', (cardIdx + 1) + ' / ' + state.cards.length);
      view.appendChild(counter);

      if (cardState[cardIdx]) {
        const known = el('button', 'btn green', '✅ Знаю');
        known.addEventListener('click', () => {
          api.post('/api/card', { index: cardIdx, known: true }).then(() => { cardIdx++; renderCards(); });
        });
        const unknown = el('button', 'btn red', '❌ Не знаю');
        unknown.addEventListener('click', () => { cardIdx++; renderCards(); });
        view.appendChild(known); view.appendChild(unknown);
      } else {
        const flip = el('button', 'btn accent', '💡 Показать ответ');
        flip.addEventListener('click', () => { cardState[cardIdx] = true; renderCards(); });
        view.appendChild(flip);
      }
    }

    function renderQuizzes() {
      clear();
      const title = el('h2', 'lesson-title', '🧪 Тесты');
      view.appendChild(title);
      state.quizzes.forEach((quiz) => {
        const card = el('div', 'card');
        const h = el('h3', null, quiz.title);
        const p = el('p', null, 'Вопросов: ' + quiz.questions.length);
        card.appendChild(h); card.appendChild(p);
        card.addEventListener('click', () => {
          quizState = { quiz: quiz, index: 0, score: 0 };
          renderQuizQuestion();
        });
        view.appendChild(card);
      });
    }

    function renderQuizQuestion() {
      clear();
      const qs = quizState;
      const quiz = qs.quiz;
      if (qs.index >= quiz.questions.length) {
        const percent = qs.score * 100 / quiz.questions.length;
        const emoji = percent >= 80 ? '🏆' : percent >= 50 ? '👍' : '💪';
        api.post('/api/quiz', { quiz_id: quiz.id, score: qs.score, total: quiz.questions.length }).then(() => {
          const res = el('div', 'section-text',
            emoji + ' ' + quiz.title + '\n\nРезультат: ' + qs.score + ' / ' + quiz.questions.length + ' (' + percent + '%)');
          const back = el('button', 'btn accent', 'К тестам');
          back.addEventListener('click', () => { quizState = null; renderQuizzes(); });
          view.appendChild(res); view.appendChild(back);
        });
        return;
      }
      const q = quiz.questions[qs.index];
      const qText = el('div', 'question', 'Вопрос ' + (qs.index + 1) + '/' + quiz.questions.length + '\n' + q.q);
      view.appendChild(qText);
      q.options.forEach((opt, i) => {
        const btn = el('button', 'option', opt);
        btn.addEventListener('click', () => {
          const correct = i === q.answer;
          btn.classList.add(correct ? 'correct' : 'wrong');
          if (correct) qs.score++;
          q.options.forEach((_, j) => {
            if (j === q.answer) btnClickedCorrect(j);
          });
          setTimeout(() => { qs.index++; renderQuizQuestion(); }, 700);
        });
        view.appendChild(btn);
      });
    }

    function btnClickedCorrect(j) {
      // highlight correct option for feedback
    }

    async function renderProgress() {
      clear();
      const title = el('h2', 'lesson-title', '📊 Прогресс');
      view.appendChild(title);
      const data = await api.get('/api/progress');
      if (!data.ok) { view.appendChild(el('p', null, 'Ошибка загрузки')); return; }
      const p = data.progress;
      const panel = el('div', 'card');
      const lessonsPct = Math.round(p.lessons_done * 100 / Math.max(1, p.lessons_total));
      const cardsPct = Math.round(p.cards_known * 100 / Math.max(1, p.cards_total));

      panel.appendChild(statRow('📚 Уроки', p.lessons_done + ' / ' + p.lessons_total));
      panel.appendChild(bar(lessonsPct));
      panel.appendChild(statRow('🃏 Карточки', p.cards_known + ' / ' + p.cards_total));
      panel.appendChild(bar(cardsPct));
      panel.appendChild(statRow('🧪 Тестов пройдено', p.quizzes_taken));
      panel.appendChild(statRow('🏆 Лучший результат', p.best_score !== null ? p.best_score + ' баллов' : 'пока нет'));
      view.appendChild(panel);
    }

    function statRow(label, value) {
      const row = el('div', 'stat-row');
      row.appendChild(el('span', null, label));
      row.appendChild(el('span', null, value));
      return row;
    }
    function bar(pct) {
      const wrap = el('div', 'bar');
      const fill = el('div', null);
      fill.style.width = Math.max(pct, 4) + '%';
      wrap.appendChild(fill);
      return wrap;
    }

    function flagEmoji(code) {
      if (!code || code.length !== 2) return '🌐';
      const A = 0x1f1e6, a = 'A'.charCodeAt(0);
      const up = code.toUpperCase().split('').map(c => String.fromCodePoint(A + (c.charCodeAt(0) - a)));
      return up.join('');
    }
    function fmtMoney(v) {
      if (v === null || v === undefined) return '—';
      return '$' + Math.round(v).toLocaleString('en-US');
    }
    function fmtRating(v) {
      if (v === null || v === undefined) return '—';
      return v.toFixed(2);
    }

    function playerRow(player, label, value) {
      const row = el('div', 'player-row');
      const rank = el('div', 'player-rank');
      rank.textContent = player.rank != null ? player.rank : player.position != null ? player.position : '—';
      if (rank.textContent === '1') rank.classList.add('top1');
      else if (rank.textContent === '2' || rank.textContent === '3') rank.classList.add('top2');
      const info = el('div', 'player-info');
      info.appendChild(el('div', 'player-nick', player.nickname));
      const meta = [];
      if (player.team) meta.push(player.team);
      if (player.country || player.country_code) meta.push(flagEmoji(player.country_code) + ' ' + (player.country || ''));
      info.appendChild(el('div', 'player-meta', meta.join(' · ')));
      const stat = el('div', 'player-stat');
      stat.appendChild(el('div', 'val', value));
      stat.appendChild(el('div', 'lab', label));
      row.appendChild(rank); row.appendChild(info); row.appendChild(stat);
      return row;
    }

    async function renderStats() {
      clear();
      const title = el('h2', 'lesson-title', '🏆 Статистика');
      view.appendChild(title);
      view.appendChild(el('div', 'spinner', 'Загрузка...'));
      try {
        const res = await api.get('/api/stats');
        if (!res.ok) throw new Error('bad response');
        const s = res.stats;
        clear();
        view.appendChild(title);
        view.appendChild(el('p', 'muted-note', 'Данные: bo3.gg + FACEIT · HLTV недоступен автоматически. Обновляется раз в 15 мин.'));
        view.appendChild(el('div', 'section-title', '🥇 Рейтинг игроков (6 месяцев)'));
        (s.top_players || []).forEach(p => {
          view.appendChild(playerRow(p, 'rating', fmtRating(p.rating)));
        });
        view.appendChild(el('div', 'section-title', '💰 Топ по призовым'));
        (s.top_earners || []).forEach((p, i) => {
          const item = Object.assign({}, p, { position: i + 1 });
          view.appendChild(playerRow(item, 'prize', fmtMoney(p.total_earnings)));
        });
        view.appendChild(el('div', 'section-title', '🎮 FACEIT · ELO (' + (s.faceit && s.faceit.region ? s.faceit.region : 'EU') + ')'));
        if (s.faceit && s.faceit.players && s.faceit.players.length) {
          s.faceit.players.forEach(p => {
            const item = Object.assign({}, p, { rank: p.position });
            view.appendChild(playerRow(item, 'ELO', p.faceit_elo != null ? p.faceit_elo.toLocaleString('en-US') : '—'));
          });
        } else {
          view.appendChild(el('p', 'section-text', 'FACEIT не подключён: добавь FACEIT_API_KEY'));
        }
        if (!s.top_players || !s.top_players.length) {
          view.appendChild(el('p', 'section-text', 'Нет данных'));
        }
      } catch (err) {
        view.appendChild(el('p', 'section-text', '⚠️ Не удалось загрузить статистику'));
      }
    }

    document.getElementById('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-tab]');
      if (!btn) return;
      document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      if (tab === 'lessons') renderLessons();
      else if (tab === 'cards') renderCards();
      else if (tab === 'quizzes') renderQuizzes();
      else if (tab === 'stats') renderStats();
      else renderProgress();
    });

    (async function init() {
      try {
        const initRes = await api.get('/api/init');
        if (!initRes.ok) { view.appendChild(el('p', 'section-text', '⚠️ Открой приложение через бота')); return; }
        state.user = initRes.user;
        userName.textContent = initRes.user.first_name;
        const content = await api.get('/api/content');
        state.lessons = content.lessons;
        state.cards = content.cards;
        state.quizzes = content.quizzes;
        const prog = await api.get('/api/progress');
        cardState = {};
        renderLessons();
      } catch (err) {
        view.appendChild(el('p', 'section-text', '⚠️ Не удалось загрузить данные'));
      }
    })();
  })();
  </script>
</body>
</html>
